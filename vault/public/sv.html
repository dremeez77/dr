<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Своя игра</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#040b2c">
<link rel="stylesheet" href="/style.css">
<style>
  html, body { height: 100%; overscroll-behavior: none; }
  .wrap { max-width: 520px; padding: 18px 16px 30px; min-height: 100%; display: flex; flex-direction: column; box-sizing: border-box; }
  .lbl { font: 700 12px/1 var(--mono); letter-spacing: .18em; color: var(--muted); }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .teams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .teams button { font: 800 26px/1 var(--mono); padding: 24px 0; border-radius: 14px; }
  .mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; padding: 20px 0; }
  .buzz { width: min(78vw, 320px); aspect-ratio: 1; border-radius: 50%; border: 0; font: 900 34px/1.1 var(--sans); color: #fff; background: radial-gradient(circle at 35% 30%, #ff9a9a, #e0303a 55%, #8a0f18);
    box-shadow: 0 14px 0 #5c0a10, 0 20px 50px rgba(255,60,60,.5); transition: transform .06s, box-shadow .06s; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .buzz:active { transform: translateY(10px); box-shadow: 0 4px 0 #5c0a10, 0 10px 30px rgba(255,60,60,.5); }
  .buzz.live { animation: live 1s ease-in-out infinite; }
  .buzz:disabled { background: radial-gradient(circle at 35% 30%, #4a5a8a, #1d2f73 60%, #0a1543); box-shadow: 0 14px 0 #050b26; color: var(--muted); animation: none; }
  .buzz.win, .buzz.win:disabled { opacity: 1;  background: radial-gradient(circle at 35% 30%, #b8ffd8, #3ddc84 55%, #0c6b3a); box-shadow: 0 14px 0 #064023, 0 20px 60px rgba(61,220,132,.6); color: #04102e; }
  @keyframes live { 50% { box-shadow: 0 14px 0 #5c0a10, 0 20px 80px rgba(255,60,60,.9); } }
  .msg { font-size: 18px; line-height: 1.4; min-height: 52px; }
  .q { font-size: 16px; color: var(--muted); line-height: 1.45; }
  .score { font: 900 40px/1 var(--mono); }
</style>
</head>
<body>
<div class="wrap" id="v"><p class="muted">Загрузка…</p></div>
<script>
'use strict';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let S = null, key = '', pressing = false, changing = false;
const v = document.getElementById('v');
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'Ошибка сети'); return j;
}
async function load() {
  try { S = await api('/api/sv'); } catch { return; }
  const c = S.cur, my = S.me ? S.scores.find(x => x.team === S.me.team) : null;
  const k = JSON.stringify([changing, S.me, c && [c.t, c.i, c.final, c.phase, c.buzzed, c.excluded, c.right, c.a], my && my.score]);
  if (k !== key) { key = k; render(); }
}
function render() {
  if (!S.me || changing) {
    v.innerHTML = `<div class="mid"><div class="lbl">СВОЯ ИГРА</div><h1 style="margin:0">Выбери свою команду</h1><p class="muted" style="margin:0">Номер написан на вашем столе.</p>
      <div class="teams" style="width:100%">${Array.from({ length: S.teams }, (_, i) => `<button data-t="${i + 1}">${i + 1}</button>`).join('')}</div></div>`;
    v.querySelectorAll('[data-t]').forEach(b => b.onclick = async () => { try { await api('/api/sv/join', { team: Number(b.dataset.t) }); changing = false; key = ''; load(); } catch (e) { alert(e.message); } });
    return;
  }
  const c = S.cur, team = S.me.team, my = S.scores.find(x => x.team === team) || { score: 0 };
  let msg = 'Смотри на экран. Ведущий выбирает вопрос.', can = false, win = false, q = '';
  if (c) {
    q = c.q ? `<div class="q">${esc(c.theme)}${c.price ? ' · ' + c.price : ''}<br>${esc(c.q)}</div>` : '';
    const out = (c.excluded || []).includes(team);
    if (c.phase === 'cat') msg = '🐱 Кот в мешке! Вопрос отдают другой команде.';
    else if (c.phase === 'show') msg = c.final ? 'Финал: напишите ответ и ставку на листке.' : 'Читай вопрос. Сейчас откроют ответы…';
    else if (c.phase === 'open') { if (out) msg = 'Ваша команда уже отвечала на этот вопрос.'; else { msg = 'Знаешь ответ? Жми!'; can = true; } }
    else if (c.phase === 'buzzed') { win = c.buzzed === team; msg = win ? '🔥 Отвечает ТВОЯ команда! Говорите вслух.' : `Отвечает команда ${c.buzzed}`; }
    else if (c.phase === 'answer') msg = c.right === team ? `✅ Верно! +${c.price}` : 'Смотри ответ на экране.';
  }
  v.innerHTML = `<div class="bar"><span class="lbl">КОМАНДА ${team}</span><button class="ghost small" id="chg" style="padding:6px 10px;font-size:13px">сменить</button></div>
    <div class="mid"><div class="score">${my.score}</div><div class="lbl" style="margin-top:-10px">БАЛЛОВ У КОМАНДЫ</div>
      <button class="buzz ${can ? 'live' : ''} ${win ? 'win' : ''}" id="bz" ${can ? '' : 'disabled'}>${win ? 'ВЫ<br>ПЕРВЫЕ' : 'Я<br>ЗНАЮ!'}</button>
      <div class="msg">${msg}</div>${q}${c && c.a && c.phase !== 'answer' ? `<div style="margin-top:6px;padding:12px 14px;border:1px dashed var(--gold);border-radius:12px;font-size:16px"><span class="lbl">ОТВЕТ — ВИДИШЬ ТОЛЬКО ТЫ</span><br><b style="font-size:20px">${esc(c.a)}</b></div>` : ''}</div>`;
  document.getElementById('chg').onclick = () => { changing = true; key = ''; render(); };
  const bz = document.getElementById('bz');
  const press = async e => { e.preventDefault(); if (pressing || bz.disabled) return; pressing = true; bz.disabled = true;
    try { const r = await api('/api/sv/buzz', {}); if (r.first && navigator.vibrate) navigator.vibrate([80, 40, 80]); } catch {}
    pressing = false; key = ''; load(); };
  bz.addEventListener('touchstart', press, { passive: false }); bz.addEventListener('mousedown', press);
}
load(); setInterval(load, 350);
</script>
</body>
</html>
