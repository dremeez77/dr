<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сделка</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#040b2c">
<link rel="stylesheet" href="/style.css">
<style>
  .wrap { max-width: 520px; padding: 18px 16px 40px; }
  .lbl { font: 700 12px/1 var(--mono); letter-spacing: .18em; color: var(--muted); }
  h1 { font-size: 24px; line-height: 1.2; margin: 10px 0 14px; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; }
  .timer { font: 800 22px/1 var(--mono); color: var(--gold); }
  .dos { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; }
  .dos div { margin-bottom: 10px; font-size: 15px; line-height: 1.45; } .dos div:last-child { margin-bottom: 0; }
  .dos b { display: block; font: 700 11px/1 var(--mono); letter-spacing: .16em; color: var(--muted); margin-bottom: 4px; }
  .dos .sig { color: #ffd78a; }
  .ch { display: grid; gap: 10px; }
  .c { width: 100%; padding: 18px 16px; border: 0; border-radius: 14px; font-size: 19px; font-weight: 800; color: #04102e; display: flex; align-items: center; gap: 12px; min-height: 64px; }
  .c i { font-style: normal; font-size: 24px; }
  .c0 { background: #3ddc84; } .c1 { background: #f5c542; } .c2 { background: #ff7a7a; }
  .c.dim { opacity: .3; } .c.me { outline: 3px solid #fff; outline-offset: 2px; }
  .teams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .teams button { font: 800 26px/1 var(--mono); padding: 26px 0; border-radius: 14px; }
  .big { text-align: center; padding: 8vh 0 0; }
  .res { margin-top: 14px; padding: 14px 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); font-size: 15px; line-height: 1.45; }
</style>
</head>
<body>
<div class="wrap" id="v"><p class="muted">Загрузка…</p></div>
<script>
'use strict';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const IC = ['🟢', '🟡', '🔴'];
let S = null, key = '', offset = 0, busy = false;
const v = document.getElementById('v');
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'Ошибка сети'); return j;
}
async function load() {
  try { S = await api('/api/deal'); offset = S.now - Date.now(); } catch { return; }
  const k = [S.phase, S.idx, S.me ? S.me.team : '', S.my].join('|');
  if (k !== key) { key = k; render(); }
}
const left = () => Math.max(0, Math.ceil((S.endsAt - (Date.now() + offset)) / 1000));
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
function dossier(a) { return `<div class="dos"><div><b>ЗАПРОС</b>${esc(a.ask)}</div><div><b>ДАННЫЕ</b>${esc(a.data)}</div><div class="sig"><b>СИГНАЛЫ</b>${esc(a.signals)}</div></div>`; }
function render() {
  if (!S.me || S.phase === 'idle' && !S.me) {
    v.innerHTML = `<div class="big"><div class="lbl">ИГРА «${esc(S.title).toUpperCase()}»</div><h1>Ты в кредитном комитете</h1><p class="muted">Выбери номер своей команды — он написан на вашем столе.</p>
      <div class="teams">${Array.from({ length: S.teams }, (_, i) => `<button data-t="${i + 1}">${i + 1}</button>`).join('')}</div></div>`;
    v.querySelectorAll('[data-t]').forEach(b => b.onclick = async () => { try { await api('/api/deal/join', { team: Number(b.dataset.t) }); key = ''; load(); } catch (e) { alert(e.message); } });
    return;
  }
  const head = `<div class="bar"><span class="lbl">КОМАНДА ${S.me.team}</span><button class="ghost small" id="chg" style="padding:6px 10px;font-size:13px">сменить</button></div>`;
  const bindChg = () => { const c = document.getElementById('chg'); if (c) c.onclick = () => { S.me = null; key = 'x'; render(); }; };
  if (S.phase === 'idle') { v.innerHTML = head + `<div class="big"><h1>Ты в команде ${S.me.team}</h1><p class="muted">Смотри на экран. Первая заявка появится здесь сама.</p></div>`; bindChg(); return; }
  if (S.phase === 'final') {
    const t = S.table || [], mine = t.find(x => x.team === S.me.team), pos = t.indexOf(mine) + 1;
    v.innerHTML = head + `<div class="big"><div class="lbl">ИГРА ОКОНЧЕНА</div><h1>Команда ${S.me.team}: ${pos}-е место</h1><div class="timer" style="font-size:44px">${mine ? mine.score : 0}</div><p class="muted">баллов · итоги на экране</p></div>`; bindChg(); return;
  }
  const a = S.app, top = `<div class="bar"><span class="lbl">ЗАЯВКА ${S.idx + 1} ИЗ ${S.total}</span>${S.phase === 'vote' ? '<span class="timer" id="t"></span>' : ''}</div><h1>${esc(a.title)}</h1>`;
  if (S.phase === 'intro') { v.innerHTML = head + top + dossier(a) + `<div class="res muted">Слушайте клиента. Голосование откроется по команде ведущего.</div>`; bindChg(); return; }
  const reveal = S.phase === 'reveal';
  let res = '';
  if (reveal) {
    const r = S.tally.find(x => x.team === S.me.team) || {};
    const dec = r.decision === null || r.decision === undefined ? 'не проголосовала' : `${IC[r.decision]} ${S.choices[r.decision]}`;
    res = `<div class="res"><b>Решение команды: ${dec}</b> · <b class="${r.points > 0 ? 'green' : r.points < 0 ? 'red' : ''}">${r.points > 0 ? '+' : ''}${r.points || 0}</b><br><br><b class="green">Верно: ${esc(S.right)}</b><br><span class="muted">${esc(S.after)}</span></div>`;
  } else if (S.my !== null) res = `<div class="res muted">Голос принят. Можно передумать, пока идёт время.</div>`;
  const ch = S.choices.map((t, i) => `<button class="c c${i} ${S.my === i ? 'me' : ''} ${(S.my !== null && S.my !== i) || reveal ? 'dim' : ''}" data-i="${i}" ${reveal ? 'disabled' : ''}><i>${IC[i]}</i>${esc(t)}</button>`).join('');
  v.innerHTML = head + top + (reveal ? '' : dossier(a)) + `<div class="ch">${ch}</div>` + res;
  v.querySelectorAll('[data-i]').forEach(b => b.onclick = async () => {
    if (busy) return; busy = true;
    try { await api('/api/deal/vote', { choice: Number(b.dataset.i) }); key = ''; await load(); } catch (e) { alert(e.message); }
    busy = false;
  });
  bindChg(); tick();
}
function tick() { const t = document.getElementById('t'); if (t && S) t.textContent = fmt(left()); }
load(); setInterval(load, 1500); setInterval(tick, 250);
</script>
</body>
</html>
