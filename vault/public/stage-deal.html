<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сцена: Сделка</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --u: min(1vw, 1.78vh); }
  html, body { margin: 0; height: 100%; }
  body { background: radial-gradient(calc(var(--u)*120) calc(var(--u)*60) at 50% 40%, #0e1c57, #040b2c 70%); color: #eef2fb; font-family: "Inter Display", Inter, system-ui, sans-serif; overflow: hidden; cursor: none; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  #s { position: absolute; inset: 0; padding: calc(var(--u)*4) calc(var(--u)*5); box-sizing: border-box; display: flex; flex-direction: column; }
  .k { font: 700 calc(var(--u)*1.5)/1 ui-monospace, monospace; letter-spacing: .26em; color: #93a5cf; text-transform: uppercase; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  h1 { font-weight: 900; font-size: calc(var(--u)*4.2); line-height: 1.08; letter-spacing: -.02em; margin: calc(var(--u)*1.4) 0; }
  .center { margin: auto; text-align: center; }
  .qr { background: #fff; padding: calc(var(--u)*1.3); border-radius: calc(var(--u)*1.4); width: calc(var(--u)*22); margin: calc(var(--u)*1.5) auto; }
  .qr svg { display: block; width: 100%; height: auto; }
  .note { font-size: calc(var(--u)*2.1); color: #d5def3; margin: calc(var(--u)*1.2) 0 0; line-height: 1.4; }
  .dos { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: calc(var(--u)*1.6); margin-top: calc(var(--u)*1); }
  .dos div { background: #0a1543; border: calc(var(--u)*.15) solid #1d2f73; border-radius: calc(var(--u)*1.4); padding: calc(var(--u)*1.6); font-size: calc(var(--u)*1.75); line-height: 1.35; }
  .dos b { display: block; font: 700 calc(var(--u)*1.3)/1 ui-monospace, monospace; letter-spacing: .2em; color: #93a5cf; margin-bottom: calc(var(--u)*1); }
  .dos .sig { border-color: #8a6a1d; color: #ffd78a; }
  .timer { font: 900 calc(var(--u)*7)/1 ui-monospace, monospace; color: #19b5fe; }
  .timer.low { color: #ff5d5d; }
  .teams { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: calc(var(--u)*1.6); margin-top: calc(var(--u)*1.6); }
  .tm { background: #0a1543; border: calc(var(--u)*.2) solid #1d2f73; border-radius: calc(var(--u)*1.6); padding: calc(var(--u)*1.3); text-align: center; }
  .tm .n { font: 900 calc(var(--u)*1.55)/1.2 ui-monospace, monospace; letter-spacing: .06em; color: #93a5cf; white-space: nowrap; }
  .bars { flex-wrap: wrap; }
  .tm .big { font: 900 calc(var(--u)*3.6)/1.1 ui-monospace, monospace; margin: calc(var(--u)*.6) 0; }
  .tm .sub { font-size: calc(var(--u)*1.8); color: #93a5cf; }
  .tm.d0 { border-color: #3ddc84; background: #0b3324; } .tm.d1 { border-color: #f5c542; background: #3a300b; } .tm.d2 { border-color: #ff7a7a; background: #3d1414; }
  .bars { display: flex; gap: calc(var(--u)*.6); justify-content: center; margin-top: calc(var(--u)*1); font: 800 calc(var(--u)*1.8)/1 ui-monospace, monospace; }
  .pts { font: 900 calc(var(--u)*2.6)/1 ui-monospace, monospace; margin-top: calc(var(--u)*.6); }
  .pos { color: #3ddc84; } .neg { color: #ff5d5d; }
  .ok { background: #0b3324; border: calc(var(--u)*.2) solid #3ddc84; border-radius: calc(var(--u)*1.4); padding: calc(var(--u)*1.3) calc(var(--u)*1.8); font-size: calc(var(--u)*1.8); margin-top: calc(var(--u)*1.4); line-height: 1.35; }
  .ok b { color: #3ddc84; }
  .lb { width: calc(var(--u)*70); margin: calc(var(--u)*2) auto 0; }
  .lb .r { display: flex; align-items: baseline; gap: calc(var(--u)*2); padding: calc(var(--u)*1.6) calc(var(--u)*2.4); margin-bottom: calc(var(--u)*1.2); background: #0a1543; border: calc(var(--u)*.15) solid #1d2f73; border-radius: calc(var(--u)*1.4); font-size: calc(var(--u)*3.4); }
  .lb .r:first-child { border-color: #19b5fe; } .lb .r:first-child .p, .lb .r:first-child .sc { color: #19b5fe; }
  .lb .p { font: 900 calc(var(--u)*3.4)/1 ui-monospace, monospace; color: #93a5cf; width: calc(var(--u)*4); }
  .lb .sc { margin-left: auto; font: 900 calc(var(--u)*3.4)/1 ui-monospace, monospace; }
  .help { position: fixed; left: 1vw; bottom: 1vh; font: 11px/1 ui-monospace, monospace; color: rgba(150,165,207,.4); }
  #warn { position: fixed; top: 0; left: 0; right: 0; background: #ff5d5d; color: #111; font: 700 16px/1.3 system-ui; padding: 10px; text-align: center; display: none; }
</style>
</head>
<body>
<div id="s"></div>
<div id="warn">Управление выключено: сначала войди в /admin в этом же браузере, потом обнови страницу.</div>
<div class="help">ПРОБЕЛ: дальше · 1–6 на раскрытии: +1 команде от жюри (повторно — снять) · Shift+R: заново · F: полный экран</div>
<script src="/vendor/qrcode.js"></script>
<script>
'use strict';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const IC = ['🟢', '🟡', '🔴'];
const qr = qrcode(0, 'M'); qr.addData(location.origin + '/deal'); qr.make();
const QR = qr.createSvgTag({ cellSize: 8, margin: 1, scalable: true });
let S = null, offset = 0, busy = false;
const s = document.getElementById('s');
const fmt = x => `${Math.floor(x / 60)}:${String(x % 60).padStart(2, '0')}`;
async function load() { try { S = await (await fetch('/api/deal')).json(); offset = S.now - Date.now(); } catch { return; } render(); }
const lb = t => `<div class="lb">${t.map((r, i) => `<div class="r"><span class="p">${i + 1}</span><span>Команда ${r.team}</span><span class="sc">${r.score}</span></div>`).join('')}</div>`;
function render() {
  if (S.phase === 'idle') {
    s.innerHTML = `<div class="center"><div class="k">Игра «${esc(S.title)}»</div><h1>Вы — кредитный комитет</h1><div class="qr">${QR}</div>
      <div class="mono" style="font-size:calc(var(--u)*3);font-weight:800;color:#19b5fe">${esc(location.host)}/deal</div>
      <div class="note">Отсканируй и выбери номер своей команды · не открывается — выключи VPN</div>
      <div class="note" style="font-size:calc(var(--u)*2.6);margin-top:calc(var(--u)*2)">Подключились: <b class="mono">${S.players}</b></div></div>`; return;
  }
  if (S.phase === 'final') { s.innerHTML = `<div class="center" style="width:100%"><div class="k">Итоги «Сделки»</div><h1>Лучший кредитный комитет</h1>${lb(S.table || [])}</div>`; return; }
  const a = S.app;
  const head = `<div class="top"><span class="k">Заявка ${S.idx + 1} из ${S.total}</span>${S.phase === 'vote' ? '<span class="timer" id="t"></span>' : S.phase === 'intro' ? '<span class="k">Слушаем клиента</span>' : ''}</div><h1>${esc(a.title)}</h1>`;
  const dos = `<div class="dos"><div><b>Запрос</b>${esc(a.ask)}</div><div><b>Данные</b>${esc(a.data)}</div><div class="sig"><b>Сигналы</b>${esc(a.signals)}</div></div>`;
  if (S.phase === 'intro') { s.innerHTML = head + dos + `<div class="note" style="margin-top:auto;text-align:center">Досье — у вас в телефонах · ${esc(location.host)}/deal</div>`; return; }
  if (S.phase === 'vote') {
    s.innerHTML = head + dos + `<div class="teams" style="--n:${S.tally.length}">${S.tally.map(t => `<div class="tm"><div class="n">КОМАНДА ${t.team}</div><div class="big">${t.voted}<span style="color:#93a5cf;font-size:.5em">/${t.members}</span></div><div class="sub">проголосовали</div></div>`).join('')}</div>`;
    tick(); return;
  }
  // reveal
  s.innerHTML = head + `<div class="teams" style="--n:${S.tally.length};margin-top:calc(var(--u)*1)">${S.tally.map(t => {
    const d = t.decision, b = S.bonus && S.bonus[t.team] ? '' : '';
    return `<div class="tm ${d === null ? '' : 'd' + d}"><div class="n">КОМАНДА ${t.team}</div><div class="big">${d === null ? '—' : IC[d]}</div><div class="sub">${d === null ? 'не голосовали' : esc(S.choices[d])}</div>
      <div class="bars">${t.counts.map((c, i) => `<span>${IC[i]}${c}</span>`).join('')}</div><div class="pts ${t.points > 0 ? 'pos' : t.points < 0 ? 'neg' : ''}">${t.points > 0 ? '+' : ''}${t.points}</div></div>`;
  }).join('')}</div>
  <div class="ok"><b>Верно: ${esc(S.right)}</b><br>${esc(S.after)}</div>
  <div class="note" style="margin-top:calc(var(--u)*1.2)">Счёт: ${(S.table || []).map(r => `команда ${r.team} — <b class="mono">${r.score}</b>`).join(' · ')}</div>`;
}
function tick() {
  const t = document.getElementById('t'); if (!t || !S) return;
  const l = Math.max(0, Math.ceil((S.endsAt - (Date.now() + offset)) / 1000));
  t.textContent = fmt(l); t.className = 'timer' + (l <= 30 ? ' low' : '');
}
async function control(body) {
  if (busy) return; busy = true;
  try { const r = await fetch('/api/deal/control', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    document.getElementById('warn').style.display = r.status === 401 || r.status === 403 ? 'block' : 'none'; } catch {}
  await load(); busy = false;
}
addEventListener('keydown', e => {
  if (['Space', 'ArrowRight', 'PageDown', 'Enter'].includes(e.code)) { e.preventDefault(); control({ action: 'next' }); }
  if (/^Digit[1-9]$/.test(e.code) && S && S.phase === 'reveal') control({ action: 'bonus', team: Number(e.code.slice(5)) });
  if (e.code === 'KeyR' && e.shiftKey && confirm('Начать «Сделку» заново? Счёт обнулится.')) control({ action: 'reset' });
  if (e.code === 'KeyF') document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
});
load(); setInterval(load, 1000); setInterval(tick, 250);
</script>
</body>
</html>
