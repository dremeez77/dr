<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Финансовый квиз</title>
<meta name="theme-color" content="#040b2c">
<link rel="stylesheet" href="/style.css">
<style>
  .wrap { max-width: 520px; padding: 18px 16px 40px; }
  .step { font: 700 12px/1 var(--mono); letter-spacing: .18em; color: var(--muted); }
  h1 { font-size: 26px; line-height: 1.2; margin: 10px 0 16px; }
  .opts { display: grid; gap: 10px; }
  .opt { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 16px; font-size: 17px; line-height: 1.3; color: #04102e; border: 0; border-radius: 14px; min-height: 64px; }
  .opt b { font: 800 20px/1 var(--mono); width: 26px; flex: none; }
  .o0 { background: #19b5fe; } .o1 { background: #ff7a7a; } .o2 { background: #f5c542; } .o3 { background: #3ddc84; }
  .opt.dim { opacity: .3; }
  .opt.me { outline: 3px solid #fff; outline-offset: 2px; }
  .big { text-align: center; padding: 10vh 0 0; }
  .big .v { font: 800 44px/1.1 var(--mono); margin: 12px 0; }
  .res { margin-top: 16px; padding: 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .timer { font: 800 22px/1 var(--mono); color: var(--gold); }
</style>
</head>
<body>
<div class="wrap" id="v"><p class="muted">Загрузка…</p></div>
<script>
'use strict';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const L = ['А', 'Б', 'В', 'Г'];
let S = null, key = '', offset = 0, busy = false;
const v = document.getElementById('v');

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Ошибка сети');
  return j;
}
async function load() {
  try { S = await api('/api/quiz'); offset = S.now - Date.now(); } catch { return; }
  const k = [S.phase, S.idx, S.me ? S.me.name : '', S.my ? S.my.choice : '', S.me ? S.me.score : ''].join('|');
  if (k !== key) { key = k; render(); }
}
const left = () => Math.max(0, Math.ceil((S.endsAt - (Date.now() + offset)) / 1000));

function render() {
  if (!S.me) {
    v.innerHTML = `<div class="big"><div class="step">${esc(S.title).toUpperCase()}</div><h1>Как тебя зовут?</h1>
      <form id="f"><input id="n" maxlength="24" placeholder="Имя и группа, например «Аня Ф-21»" autocomplete="off" required>
      <div class="err" id="e"></div><button style="width:100%;margin-top:6px">Играть</button></form>
      <p class="muted" style="font-size:13px;margin-top:16px">Имя увидит весь зал в таблице лучших.</p></div>`;
    document.getElementById('f').onsubmit = async e => { e.preventDefault(); try { await api('/api/quiz/join', { name: document.getElementById('n').value }); key = ''; load(); } catch (err) { document.getElementById('e').textContent = err.message; } };
    document.getElementById('n').focus();
    return;
  }
  const head = `<div class="bar"><span class="step">${esc(S.me.name)}</span><span class="pill gold">${S.me.score} баллов</span></div>`;
  if (S.phase === 'idle') { v.innerHTML = head + `<div class="big"><h1>Ты в игре</h1><p class="muted">Смотри на экран. Первый вопрос появится здесь сам.</p></div>`; return; }
  if (S.phase === 'final') {
    const pos = S.me.rank ? `${S.me.rank}-е место` : '';
    v.innerHTML = head + `<div class="big"><div class="step">КВИЗ ОКОНЧЕН</div><div class="v gold">${S.me.score}</div><p>${pos}</p><p class="muted">Итоги на большом экране.</p></div>`; return;
  }
  const reveal = S.phase === 'reveal';
  const opts = S.a.map((t, i) => {
    let cls = 'o' + i;
    if (S.my && S.my.choice === i) cls += ' me';
    if (reveal && i !== S.correct) cls += ' dim';
    if (!reveal && S.my && S.my.choice !== i) cls += ' dim';
    return `<button class="opt ${cls}" data-i="${i}" ${S.my || reveal ? 'disabled' : ''}><b>${L[i]}</b><span>${esc(t)}</span></button>`;
  }).join('');
  let res = '';
  if (reveal) {
    const ok = S.my && S.my.choice === S.correct;
    res = `<div class="res"><b class="${ok ? 'green' : 'red'}">${!S.my ? 'Ты не успел ответить' : ok ? `Верно! +${S.my.pts}` : 'Неверно'}</b><br><span class="muted">${esc(S.note)}</span></div>`;
  } else if (S.my) res = `<div class="res muted">Ответ принят. Ждём остальных…</div>`;
  v.innerHTML = head + `<div class="bar"><span class="step">ВОПРОС ${S.idx + 1} ИЗ ${S.total} · ${esc(S.round).toUpperCase()}</span>${reveal ? '' : '<span class="timer" id="t"></span>'}</div>
    <h1>${esc(S.q)}</h1><div class="opts">${opts}</div>${res}`;
  v.querySelectorAll('[data-i]').forEach(b => b.onclick = async () => {
    if (busy || S.my) return; busy = true;
    try { await api('/api/quiz/answer', { choice: Number(b.dataset.i) }); key = ''; await load(); }
    catch (err) { alert(err.message); }
    busy = false;
  });
  tick();
}
function tick() { const t = document.getElementById('t'); if (t && S) t.textContent = left() + ' с'; }
load(); setInterval(load, 1000); setInterval(tick, 250);
</script>
</body>
</html>
