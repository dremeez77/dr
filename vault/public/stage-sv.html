<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сцена: Своя игра</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --u: min(1vw, 1.78vh); --b: #19b5fe; --g: #3ddc84; --r: #ff5d5d; --y: #f5c542; --m: #93a5cf; --line: #1d2f73; --panel: #0a1543; }
  html, body { margin: 0; height: 100%; }
  body { background: radial-gradient(calc(var(--u)*120) calc(var(--u)*70) at 50% 35%, #0e1c57, #040b2c 72%); color: #eef2fb; font-family: "Inter Display", Inter, system-ui, sans-serif; overflow: hidden; user-select: none; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  #s { position: absolute; inset: 0; padding: calc(var(--u)*2.4) calc(var(--u)*3) calc(var(--u)*1.4); box-sizing: border-box; display: flex; flex-direction: column; gap: calc(var(--u)*1.4); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: calc(var(--u)*2); }
  .ttl { font: 900 calc(var(--u)*3.6)/1 ui-monospace, monospace; letter-spacing: .25em; }
  .ttl span { color: var(--b); }
  .qr { display: flex; align-items: center; gap: calc(var(--u)*1.2); font: 700 calc(var(--u)*1.5)/1.3 ui-monospace, monospace; color: var(--m); }
  .qr div { background: #fff; padding: calc(var(--u)*.5); border-radius: calc(var(--u)*.6); width: calc(var(--u)*8); } .qr svg { display: block; width: 100%; height: auto; }
  /* табло */
  .board { flex: 1; display: grid; grid-template-columns: repeat(var(--n), 1fr); grid-template-rows: auto repeat(5, 1fr); gap: calc(var(--u)*.9); min-height: 0; }
  .th { display: flex; align-items: center; justify-content: center; text-align: center; padding: calc(var(--u)*1) calc(var(--u)*.6); border-radius: calc(var(--u)*1); background: #0b1a55; border: calc(var(--u)*.15) solid var(--line);
    font: 800 calc(var(--u)*1.65)/1.15 Inter, system-ui, sans-serif; text-transform: uppercase; letter-spacing: .02em; min-height: calc(var(--u)*6.5); }
  .cell { display: flex; align-items: center; justify-content: center; border-radius: calc(var(--u)*1); background: linear-gradient(160deg, #102a8a, #0a1a5c); border: calc(var(--u)*.15) solid #2a47b0;
    font: 900 calc(var(--u)*4)/1 ui-monospace, monospace; color: var(--y); cursor: pointer; transition: transform .15s, box-shadow .15s; text-shadow: 0 0 calc(var(--u)*2) rgba(245,197,66,.35); }
  .cell:hover { transform: scale(1.04); box-shadow: 0 0 calc(var(--u)*3) rgba(25,181,254,.5); }
  .cell.used { background: #071036; border-color: #13215e; color: transparent; text-shadow: none; cursor: default; }
  .cell.used:hover { transform: none; box-shadow: none; }
  /* счёт */
  .scores { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: calc(var(--u)*.9); }
  .sc { position: relative; text-align: center; padding: calc(var(--u)*.8) calc(var(--u)*.4); border-radius: calc(var(--u)*1); background: var(--panel); border: calc(var(--u)*.15) solid var(--line); transition: all .3s; }
  .sc .n { font: 700 calc(var(--u)*1.35)/1 ui-monospace, monospace; letter-spacing: .12em; color: var(--m); }
  .sc .v { font: 900 calc(var(--u)*3)/1.1 ui-monospace, monospace; margin-top: calc(var(--u)*.4); }
  .sc .v.neg { color: var(--r); }
  .sc .adj { position: absolute; top: calc(var(--u)*.3); right: calc(var(--u)*.3); display: none; gap: 2px; }
  .sc:hover .adj { display: flex; } .adj button { font: 700 11px/1 monospace; padding: 3px 5px; border-radius: 4px; border: 0; cursor: pointer; }
  .sc.hot { border-color: var(--y); background: #3a300b; box-shadow: 0 0 calc(var(--u)*3) rgba(245,197,66,.6); transform: translateY(calc(var(--u)*-.6)); }
  .sc.out { opacity: .35; }
  .sc .m { font-size: calc(var(--u)*1.1); color: var(--m); }
  /* вопрос */
  .qv { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 0; padding: 0 calc(var(--u)*4); }
  .qk { font: 700 calc(var(--u)*1.8)/1 ui-monospace, monospace; letter-spacing: .22em; color: var(--m); text-transform: uppercase; }
  .qk b { color: var(--y); }
  .qt { font: 800 calc(var(--u)*4.4)/1.2 Inter, system-ui, sans-serif; margin: calc(var(--u)*2.6) 0; text-wrap: balance; max-width: calc(var(--u)*150); }
  .qa { font: 900 calc(var(--u)*5)/1.15 Inter, system-ui, sans-serif; color: var(--g); text-shadow: 0 0 calc(var(--u)*3) rgba(61,220,132,.45); animation: pop .5s cubic-bezier(.2,1.4,.4,1); }
  .st { font: 700 calc(var(--u)*2.2)/1.3 ui-monospace, monospace; color: var(--m); min-height: calc(var(--u)*7); display: flex; align-items: center; gap: calc(var(--u)*1.4); }
  .st.open { color: var(--b); animation: pulse 1s ease-in-out infinite; }
  .who { font: 900 calc(var(--u)*7)/1 ui-monospace, monospace; color: var(--y); text-shadow: 0 0 calc(var(--u)*4) rgba(245,197,66,.6); animation: pop .4s cubic-bezier(.2,1.4,.4,1); }
  .tmr { font: 900 calc(var(--u)*4)/1 ui-monospace, monospace; color: var(--b); } .tmr.low { color: var(--r); }
  .cat { font: 900 calc(var(--u)*9)/1 Inter, system-ui, sans-serif; color: var(--y); animation: catIn 1s cubic-bezier(.2,1.4,.4,1); }
  .hint { position: fixed; left: 1vw; bottom: .6vh; font: 11px/1.4 ui-monospace, monospace; color: rgba(150,165,207,.45); }
  #warn { position: fixed; top: 0; left: 0; right: 0; background: var(--r); color: #111; font: 700 16px/1.3 system-ui; padding: 10px; text-align: center; display: none; z-index: 5; }
  .ok { color: var(--g); } .bad { color: var(--r); }
  .flash { position: fixed; inset: 0; pointer-events: none; animation: fl .6s ease forwards; }
  @keyframes fl { from { opacity: .55; } to { opacity: 0; } }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }
  @keyframes pulse { 50% { opacity: .55; } }
  @keyframes catIn { 0% { transform: scale(.2) rotate(-20deg); opacity: 0; } 100% { transform: none; } }
</style>
</head>
<body>
<div id="s"></div>
<div id="warn">Управление выключено: сначала войди в /admin в этом же браузере, потом обнови страницу.</div>
<div class="hint" id="hint"></div>
<script src="/vendor/qrcode.js"></script>
<script>
'use strict';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const qr = qrcode(0, 'M'); qr.addData(location.origin + '/sv'); qr.make();
const QR = qr.createSvgTag({ cellSize: 6, margin: 1, scalable: true });
const ANSWER_SEC = 15;
let S = null, offset = 0, busy = false, lastKey = '', lastBuzz = 0;
const s = document.getElementById('s'), hint = document.getElementById('hint');
const now = () => Date.now() + offset;

async function load() { try { S = await (await fetch('/api/sv')).json(); offset = S.now - Date.now(); } catch { return; } render(); }
async function ctl(body) {
  if (busy) return; busy = true;
  try { const r = await fetch('/api/sv/control', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    document.getElementById('warn').style.display = r.status === 401 || r.status === 403 ? 'block' : 'none';
    if (!r.ok && r.status !== 401 && r.status !== 403) { const j = await r.json().catch(() => ({})); alert(j.error || 'Ошибка'); } } catch {}
  await load(); busy = false;
}
function flash(color) { const f = document.createElement('div'); f.className = 'flash'; f.style.background = color; document.body.appendChild(f); setTimeout(() => f.remove(), 700); }
function scoresHtml() {
  const c = S.cur;
  return `<div class="scores" style="--n:${S.scores.length}">${S.scores.map(t => {
    const hot = c && c.buzzed === t.team, out = c && (c.excluded || []).includes(t.team);
    return `<div class="sc ${hot ? 'hot' : ''} ${out ? 'out' : ''}"><div class="adj"><button data-adj="${t.team}" data-d="-100">−100</button><button data-adj="${t.team}" data-d="100">+100</button></div>
      <div class="n">КОМАНДА ${t.team}</div><div class="v ${t.score < 0 ? 'neg' : ''}">${t.score}</div><div class="m">${t.members ? t.members + ' чел.' : '—'}</div></div>`; }).join('')}</div>`;
}
function render() {
  if (!S.loaded) { s.innerHTML = `<div class="qv"><div class="qt">Вопросы не загружены</div><div class="st">Расшифруй packs/sv.enc в data/sv.json на сервере</div></div>`; return; }
  const c = S.cur;
  // звук/вспышка при первом нажатии
  if (c && c.buzzed && c.buzzAt !== lastBuzz) { lastBuzz = c.buzzAt; flash('rgba(245,197,66,.6)'); }
  const key = JSON.stringify([c, S.used, S.scores.map(x => x.score + ':' + x.members)]);
  if (key === lastKey) { tick(); return; } lastKey = key;
  const top = `<div class="top"><div class="ttl">СВОЯ <span>ИГРА</span></div><div class="qr"><span>Кнопка «Я знаю!»:<br>${esc(location.host)}/sv</span><div>${QR}</div></div></div>`;
  if (!c) {
    s.innerHTML = top + `<div class="board" style="--n:${S.board.length}">${S.board.map(t => `<div class="th">${esc(t.name)}</div>`).join('')}${
      [0, 1, 2, 3, 4].map(i => S.board.map((t, ti) => `<div class="cell ${S.used[ti + ':' + i] ? 'used' : ''}" data-t="${ti}" data-i="${i}">${t.prices[i] || ''}</div>`).join('')).join('')}</div>` + scoresHtml();
    hint.textContent = 'Клик по клетке — вопрос · кнопка «Ф» — финальный вопрос · навести на счёт команды — ±100 · Shift+R — начать заново · F11 — полный экран';
  } else {
    let st = '', body = '';
    const head = `<div class="qk">${esc(c.theme)}${c.price ? ` · <b>${c.price}</b>` : ' · ФИНАЛ'}</div>`;
    if (c.phase === 'cat') {
      body = `<div class="cat">🐱 КОТ В МЕШКЕ</div><div class="st" style="margin-top:calc(var(--u)*3)">Команда, открывшая вопрос, отдаёт его другой команде. Нажми цифру команды на клавиатуре</div>`;
    } else {
      body = `<div class="qt">${esc(c.q)}</div>`;
      if (c.phase === 'show') st = c.final ? 'Команды пишут ответ и ставку на листке · ПРОБЕЛ — показать ответ' : 'ПРОБЕЛ — принимаем ответы';
      if (c.phase === 'open') st = `<span>Жмите «Я знаю!» на телефонах</span>`;
      if (c.phase === 'buzzed') st = `<span class="who">КОМАНДА ${c.buzzed}</span><span class="tmr" id="tmr"></span>`;
      if (c.phase === 'answer') body += `<div class="qa">${esc(c.a)}</div>`;
      if (c.phase === 'answer') st = c.right ? `<span class="ok">+${c.price || 0} команде ${c.right}</span>` : '';
    }
    s.innerHTML = top + `<div class="qv">${head}${body}<div class="st ${c.phase === 'open' ? 'open' : ''}">${st}</div></div>` + scoresHtml();
    hint.textContent = c.phase === 'buzzed' ? 'ENTER — верно · BACKSPACE — неверно (право ответа переходит к другим) · ESC — показать ответ
      : c.phase === 'open' ? 'Ждём нажатия · ESC — никто не знает, показать ответ
      : c.phase === 'answer' ? 'ПРОБЕЛ — назад к табло' : c.phase === 'cat' ? 'Цифра 1–9 — кому отдать вопрос' : 'ПРОБЕЛ — открыть ответы · ESC — показать ответ;
  }
  s.querySelectorAll('[data-t]').forEach(el => el.onclick = () => { if (!el.classList.contains('used')) ctl({ action: 'open', t: Number(el.dataset.t), i: Number(el.dataset.i) }); });
  s.querySelectorAll('[data-adj]').forEach(el => el.onclick = e => { e.stopPropagation(); ctl({ action: 'adjust', team: Number(el.dataset.adj), delta: Number(el.dataset.d) }); });
  tick();
}
function tick() {
  const t = document.getElementById('tmr'); if (!t || !S.cur || !S.cur.buzzAt) return;
  const l = Math.max(0, ANSWER_SEC - Math.floor((now() - S.cur.buzzAt) / 1000)); t.textContent = l; t.className = 'tmr' + (l <= 5 ? ' low' : '');
}
addEventListener('keydown', e => {
  if (!S) return; const c = S.cur;
  if (e.code === 'KeyR' && e.shiftKey) { if (confirm('Начать «Свою игру» заново? Счёт обнулится.')) ctl({ action: 'reset' }); return; }
  if (!c && (e.code === 'KeyF' || e.key === 'ф' || e.key === 'Ф' || e.key === 'f')) { if (confirm('Открыть финальный вопрос?')) ctl({ action: 'final' }); return; }
  if (!c) return;
  if (c.phase === 'cat' && /^Digit[1-9]$/.test(e.code)) { ctl({ action: 'cat_to', team: Number(e.code.slice(5)) }); return; }
  if (e.code === 'Space') { e.preventDefault(); if (c.phase === 'show') ctl({ action: c.final ? 'reveal' : 'arm' }); else if (c.phase === 'answer') ctl({ action: 'close' }); return; }
  if (e.code === 'Enter' && c.phase === 'buzzed') { flash('rgba(61,220,132,.5)'); ctl({ action: 'right' }); return; }
  if (e.code === 'Backspace' && c.phase === 'buzzed') { e.preventDefault(); flash('rgba(255,93,93,.5)'); ctl({ action: 'wrong' }); return; }
  if (e.code === 'Escape') { ctl({ action: 'reveal' }); return; }
});
load(); setInterval(load, 400); setInterval(tick, 250);
</script>
</body>
</html>
